
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:5432/ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Prepare disposable test database
        run: npx prisma db push --accept-data-loss

      - name: Run backend tests
        run: npm test

      - name: Run database integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

  deploy_alpha:
    name: Deploy Backend Alpha
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/alpha'

    runs-on: ubuntu-latest
    environment: alpha
    timeout-minutes: 35

    concurrency:
      group: workpulse-backend-alpha-deploy
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check GitHub OIDC Identity
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          JWT=$(printf '%s' "$RESPONSE" | jq -r '.value')
          PAYLOAD=$(printf '%s' "$JWT" | cut -d '.' -f 2)

          OIDC_PAYLOAD="$PAYLOAD" python3 - <<'PY'
          import os
          import json
          import base64

          payload = os.environ["OIDC_PAYLOAD"]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy Backend Through AWS SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.ALPHA_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PARAMETERS=$(jq -nc --arg sha "$DEPLOY_SHA" \
            '{commands:["sudo -iu ubuntu /home/ubuntu/bin/deploy-alpha-backend.sh " + $sha]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 1800 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null) || STATUS="Pending"

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query StandardOutputContent \
                --output text

              echo "BACKEND ALPHA DEPLOYMENT SUCCESS"
              exit 0
            fi

            case "$STATUS" in
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timeout"
          exit 1
